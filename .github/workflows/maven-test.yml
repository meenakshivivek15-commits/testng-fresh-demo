steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - name: Run Maven tests
    run: mvn clean test

  - name: Verify report folders
    if: always()
    run: |
      ls -la
      ls -la target || true
      ls -la target/surefire-reports || true
      ls -la test-output || true

  - name: Upload TestNG & Extent Reports
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: test-reports
      path: |
        target/surefire-reports
        test-output
